services:
  todoapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOTNET_VERSION: "8.0"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_NAME: ToDo
      DB_USER: todoapp
      DB_PASSWORD: verydangeruspassword
    expose:
      - "8080"                        # only inside Docker network
    volumes:
      - todoapp-db:/var/lib/mysql
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"                       # HTTP
      - "443:443"                     # HTTPS
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    depends_on:
      - todoapp
    restart: unless-stopped

  # one-shot: gets / updates the certificate the first time
  certbot_init:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    depends_on:
      - nginx
    # run once on deploy; '|| true' so compose doesn't fail if cert already exists
    command: >
      sh -c "sleep 30 &&
             certbot certonly --webroot -w /var/www/certbot
             -d softwaresolutiongledisheygg.com
             -d www.softwaresolutiongledisheygg.com
             --email samgledish@gmail.com
             --agree-tos --non-interactive || true"
    restart: "no"

  # long-running service: renew certs
  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    depends_on:
      - nginx
    command: /bin/sh -c "while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"
    restart: unless-stopped

volumes:
  todoapp-db:
