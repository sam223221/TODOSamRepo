services:
  todoapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOTNET_VERSION: "8.0"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_NAME: ToDo
      DB_USER: todoapp
      DB_PASSWORD: verydangeruspassword
    expose:
      - "80:8080"                        # only inside Docker network
    volumes:
      - todoapp-db:/var/lib/mysql
    restart: unless-stopped

volumes:
  todoapp-db:
